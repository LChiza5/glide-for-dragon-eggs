name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> $GITHUB_PATH

      - name: Instalar herramientas fijadas
        run: rokit install --no-trust-check

      - name: Instalar paquetes de Wally
        run: wally install --locked

      - name: Formato (StyLua)
        run: stylua --check src/

      - name: Lint (selene)
        run: selene src/

      - name: Construir el lugar
        run: |
          mkdir -p build
          rojo build default.project.json --output build/place.rbxl
